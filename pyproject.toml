[project]
name = "platesh"
version = "1.0.0"
description = "Оплата Telegram Stars и CryptoBot для нескольких Telegram-ботов"
requires-python = ">=3.10"
dependencies = ["aiogram>=3.13,<4", "aiosqlite>=0.20", "PyYAML>=6.0"]

[project.scripts]
platesh = "platesh.__main__:main"

[tool.setuptools]
packages = ["platesh", "platesh.bots"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
